<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إرسال الطلب بنجاح | منصة الأرباح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #3b82f6;
            --brand-secondary: #8b5cf6;
            --brand-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --success: #10b981;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: var(--brand-gradient);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1; opacity: 0.1;
            animation: move 20s infinite alternate;
        }
        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; animation-delay: -10s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        .success-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(200%);
            border-radius: 28px;
            padding: 50px 35px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            animation: cardEntry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .success-icon {
            width: 90px; height: 90px;
            background: var(--success);
            color: white;
            font-size: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
            animation: iconPop 0.6s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes iconPop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .data-display {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 35px;
            text-align: right;
            border: 1px solid var(--glass-border);
        }

        .data-item {
            margin-bottom: 15px;
        }

        .data-item:last-child { margin-bottom: 0; }

        .data-item .label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .data-item .value {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 8px 15px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .status-pill i { font-size: 12px; }

        .btn-home {
            width: 100%;
            padding: 18px;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4); }

        .timer {
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="success-card">
    <div class="success-icon">
        <i class="fas fa-check"></i>
    </div>
    
    <h1>تم استلام طلب السحب</h1>
    <p>تم إرسال بياناتك بنحو ناجح إلى قسم التدقيق المالي، سيتم معالجة الطلب خلال 10-20 دقيقة.</p>

    <div class="status-pill">
        <i class="fas fa-clock"></i> جاري المراجعة الآن
    </div>

    <div class="data-display">
        <div class="data-item">
            <span class="label">اسم المستلم</span>
            <span class="value" id="res-name">---</span>
        </div>
        <div class="data-item">
            <span class="label">عنوان المحفظة</span>
            <span class="value" id="res-phone">---</span>
        </div>
        <div class="data-item">
            <span class="label">مبلغ السحب المجدول</span>
            <span class="value">35,000 ج.م</span>
        </div>
    </div>

    <a href="index.html" class="btn-home">
        العودة للرئيسية <i class="fas fa-home"></i>
    </a>

    <div class="timer">
        رقم المعاملة: <span id="trans-id">TXN-7482910</span>
    </div>
</div>

<script>
    window.onload = function() {
        const name = localStorage.getItem('userName') || 'غير معروف';
        const phone = localStorage.getItem('userPhone') || 'غير معروف';
        
        document.getElementById('res-name').innerText = name;
        document.getElementById('res-phone').innerText = phone;
        
        // Generate random transaction ID
        const randomId = 'TXN-' + Math.floor(Math.random() * 9000000 + 1000000);
        document.getElementById('trans-id').innerText = randomId;
    };
</script>

</body>
</html>
